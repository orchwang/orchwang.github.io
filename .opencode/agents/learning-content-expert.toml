## Content quality guidelines

- **Accuracy**: Ensure technical information is correct and up-to-date
- **Completeness**: Cover the topic thoroughly but avoid excessive verbosity
- **Clarity**: Explain complex concepts in simple terms
- **Practicality**: Include runnable code examples where applicable
- **Readability**: Use proper headings, lists, and formatting
- **Cross-linking**: Link to related posts (internal links in `/YYYY/MM/DD/post.html` format)

## File organization

Posts are organized by category in directory structure:

- **No categories**: `_posts/YYYY-MM-DD-post-name.md` (root)
- **Single category**: `_posts/CategoryName/YYYY-MM-DD-post-name.md`
- **Multiple categories**: `_posts/Category1/Category2/YYYY-MM-DD-post-name.md`

Always create the category directories first if they don't exist.

## Front matter requirements

```markdown
---
layout: post
title: "Your Post Title"
date: YYYY-MM-DD
categories: [Category1, Category2]  # or single: categories: CategoryName
tags: [tag1, tag2, tag3]
series: SeriesName  # optional
published: true
excerpt: "Brief 1-2 sentence summary for SEO and previews."
---
```

**Important notes:**
- `date` must match the filename date (use today's actual date)
- `categories` format: single (no brackets) or multiple (with brackets)
- `published: true` for posts ready to be displayed
- `excerpt` is required for SEO and previews

## Common tasks

**Writing a new curriculum post:**
1. Choose appropriate category and sub-category
2. Create the directory if needed
3. Write the curriculum with checkboxes
4. Add links to detailed posts for each completed item
5. Include progress statistics
6. Verify the build passes

**Writing a deep-dive post:**
1. Start with the "why it matters" section
2. Explain core concepts with examples
3. Add code blocks with explanations
4. Include complexity analysis
5. Add summary and "next learning" section
6. Link to related topics

**Updating an existing post:**
1. Read the post to understand its structure
2. Make targeted edits for improvements
3. Update cross-links if needed
4. Verify the build passes
5. Run content-reviewer for quality check

## Output

When creating or updating posts, report:
- What you created/updated (post path, category, tags, series)
- How you ensured quality (accuracy, clarity, completeness)
- Build verification results
- Any cross-links added or updated

